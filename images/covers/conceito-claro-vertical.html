<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@0,600;0,800;1,500&display=swap" rel="stylesheet">
<style>
  *{margin:0;box-sizing:border-box}
  .cover{position:relative;width:1200px;height:1800px;overflow:hidden;
    background:
      radial-gradient(1100px 800px at 78% 12%, rgba(180,83,9,0.08), transparent 60%),
      #f4f3ee;
    font-family:"Inter",sans-serif;}
  svg{position:absolute;left:0;right:0;top:300px;width:100%;}
  .txt{position:absolute;left:100px;right:100px;bottom:200px;}
  h1{font-family:"Playfair Display",serif;font-weight:800;color:#1a1a1a;font-size:150px;line-height:0.95;letter-spacing:-.015em;}
  .sub{font-family:"Playfair Display",serif;font-style:italic;font-weight:500;color:#5b5b55;font-size:48px;line-height:1.2;margin-top:24px;max-width:18ch;}
  .rule{width:120px;height:3px;background:#b45309;margin:56px 0 28px;}
  .author{color:#3a3a36;font-size:30px;font-weight:600;}
  .meta{color:#8a8a82;font-size:25px;font-weight:500;margin-top:8px;}
</style></head><body>
<div class="cover">
  <svg viewBox="0 0 1200 560" preserveAspectRatio="xMidYMid meet">
    <line x1="120" y1="440" x2="1080" y2="440" stroke="#cfcdc4" stroke-width="2.5"/>
    <line x1="430" y1="120" x2="430" y2="440" stroke="#cfcdc4" stroke-width="2.5" stroke-dasharray="9 9"/>
    <line x1="800" y1="120" x2="800" y2="440" stroke="#cfcdc4" stroke-width="2.5" stroke-dasharray="9 9"/>
    <path d="M220 440 Q325 440 367 280 Q409 120 430 120 Q451 120 493 280 Q535 440 640 440"
          fill="none" stroke="#bcbab0" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M590 440 Q695 440 737 280 Q779 120 800 120 Q821 120 863 280 Q905 440 1010 440"
          fill="none" stroke="#1a1a1a" stroke-width="5.5" stroke-linecap="round"/>
    <g stroke="#b45309" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="438" y1="496" x2="780" y2="496"/>
      <path d="M752 478 L788 496 L752 514"/>
    </g>
  </svg>
  <div class="txt">
    <h1>Viés &amp; Erro</h1>
    <div class="sub">Erro sistemático e vieses em pesquisa epidemiológica</div>
    <div class="rule"></div>
    <div class="author">Henrique Alvarenga da Silva</div>
  </div>
</div></body></html>
