project:
  type: website
  output-dir: _site
  resources:
    - "references/csl_styles/*.csl"
    - "images/**"
    - "data/**"

website:
  title: "Viés e Erro em Pesquisa Epidemiológica"
  description: "Curso aberto sobre erro sistemático e vieses em pesquisa epidemiológica — material didático em português."
  site-url: "https://henriquealvarenga.github.io/vies/"
  repo-url: "https://github.com/henriquealvarenga/vies"
  repo-actions: [edit, issue]
  page-navigation: true
  back-to-top-navigation: true
  reader-mode: false
  search:
    location: navbar
    type: overlay
  navbar:
    background: "#F9F9F7"
    foreground: "#1a1a1a"
    title: " "
    collapse-below: lg
    left:
      - text: ""
        href: index.qmd
        icon: house-fill
        aria-label: "Início"
      - text: "Conceitos"
        href: conceitos/erro-sistematico-aleatorio.qmd
      - text: "Vieses"
        href: tipos-vies/vies-selecao.qmd
      - text: "Delineamentos"
        href: delineamentos/transversais.qmd
      - text: "Casos"
        href: casos/literary-digest-1936.qmd
      - text: "Bibliografia"
        href: referencias.qmd
    right:
      - text: "Atividade"
        href: material-alunos/instrucoes-trabalho.qmd
      - text: "Créditos"
        href: creditos.qmd
      - icon: github
        href: "https://github.com/henriquealvarenga/vies"
        aria-label: "Repositório no GitHub"

  sidebar:
    - title: "Conceitos"
      style: docked
      background: "#f2f2ee"
      contents:
        - section: "Fundamentos"
          contents:
            - conceitos/erro-sistematico-aleatorio.qmd
            - conceitos/definicao-vies.qmd
            - conceitos/vies-vs-confusao.qmd
            - conceitos/relacoes-espurias.qmd
            - conceitos/variaveis-dependentes-independentes.qmd
    - title: "Vieses"
      style: docked
      background: "#f2f2ee"
      contents:
        - section: "As quatro grandes famílias"
          contents:
            - tipos-vies/vies-selecao.qmd
            - tipos-vies/vies-afericao.qmd
            - tipos-vies/vies-memoria.qmd
            - tipos-vies/vies-nao-resposta.qmd
        - section: "Vieses com nome próprio"
          contents:
            - nominados/vies-de-selecao.qmd
            - nominados/vies-de-memoria.qmd
            - nominados/vies-de-nao-resposta.qmd
            - nominados/vies-berkson.qmd
            - nominados/vies-neyman.qmd
            - nominados/healthy-worker.qmd
            - nominados/falacia-ecologica.qmd
            - nominados/falacia-atomistica.qmd
            - nominados/vies-perda-seguimento.qmd
            - nominados/vies-afericao-diferencial.qmd
            - nominados/vies-entrevistador.qmd
            - nominados/vies-deteccao.qmd
            - nominados/vies-publicacao.qmd
            - nominados/vies-lead-time.qmd
    - title: "Delineamentos"
      style: docked
      background: "#f2f2ee"
      contents:
        - section: "Vieses por delineamento"
          contents:
            - delineamentos/transversais.qmd
            - delineamentos/ecologicos.qmd
            - delineamentos/coorte.qmd
            - delineamentos/caso-controle.qmd
    - title: "Casos"
      style: docked
      background: "#f2f2ee"
      contents:
        - section: "Estudos de caso clássicos"
          contents:
            - casos/literary-digest-1936.qmd
            - casos/hite-report.qmd
            - casos/alcool-mortalidade.qmd

  page-footer:
    background: "#1a1a1a"
    foreground: "#ffffff"
    border: false
    left: |
      © 2026 · Licença MIT
    center: |
      Material didático aberto · Viés e Erro em Pesquisa Epidemiológica
    right:
      - icon: github
        href: "https://github.com/henriquealvarenga/vies"

format:
  html:
    theme:
      - cosmo
      - theme-editorial.scss
    css: styles.css
    toc: true
    toc-location: right
    toc-depth: 3
    toc-title: "Nesta página"
    number-sections: false
    code-copy: true
    code-overflow: wrap
    smooth-scroll: true
    anchor-sections: true
    fig-cap-location: bottom
    tbl-cap-location: top
    citations-hover: true
    footnotes-hover: true
    link-external-newwindow: true
    link-external-icon: true
    include-in-header:
      - text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

bibliography: references/referencias.bib
csl: references/csl_styles/vancouver.csl
citation: false

lang: pt-BR

execute:
  freeze: auto
  echo: false
  warning: false
  message: false
